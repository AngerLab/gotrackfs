name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install FUSE headers (Linux build dependency)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev

      - name: Install FUSE-T headers (macOS build dependency)
        if: runner.os == 'macOS'
        run: brew install macos-fuse-t/homebrew-cask/fuse-t

      - name: Vet
        env:
          # cgofuse builds against libfuse2 headers by default; use libfuse3 on Linux
          GOFLAGS: ${{ runner.os == 'Linux' && '-tags=fuse3' || '' }}
        run: go vet ./...

      - name: Test
        env:
          GOFLAGS: ${{ runner.os == 'Linux' && '-tags=fuse3' || '' }}
        run: go test -race ./...
